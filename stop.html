<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STOP! Arriero</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="back" href="./">← Games</a>
<main><h1>STOP! Arriero</h1><p class="muted">Vocabulary of arriero culture from Colombia's Coffee Region</p><div id="app"><p class="muted">Loading…</p></div></main>
<div id="err" role="alert"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
import { boot, supabase, patchRoom, esc, $, clamp } from "./kit.js";

// Available letters (no K, W, X, Ñ). Edit this line to change them.
const AL = "ABCDEFGHIJLMNOPQRSTUVYZ".split("");
// [id, category name]. Edit or add categories here (9 max by default).
const CATS = [
  ['ropa', 'Clothing & gear'], ['animal', 'Animals'], ['aperos', 'Tools & tack'], ['comida', 'Food & drink'], ['planta', 'Plants & crops'],
  ['lugar', 'Places & towns'], ['oficio', 'People & jobs'], ['verbo', 'Verbs (action)'], ['paisaje', 'Landscape & nature']
];
const LANGS = { es: 'Spanish', en: 'English' };
const cats = K => CATS.slice(0, K.st().cat_count || 8).map(c => ({ id: c[0], name: c[1] }));
const rl = AL[Math.floor(Math.random() * AL.length)];

const base = c => c.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
const LET = { es: 'A-ZÁÉÍÓÚÜÑ', en: 'A-Z' }, VOW = 'AEIOUYÁÉÍÓÚÜ';
const shape = (w, lang) => {
  if (!w) return null;
  const L = LET[lang] || LET.es;
  if (!new RegExp(`^[${L}]+(?:[ '’-][${L}]+)*$`).test(w)) return 'only letters of the chosen language';
  if (w.replace(/[ '’-]/g, '').length < 3) return 'at least 3 letters';
  if (w.split(/[ '’-]/).some(s => s.length > 1 && !new RegExp(`[${VOW}]`).test(s)) || /(.)\1{2,}/.test(w)) return "doesn't look like a word";
  return null;
};
const judge = (raw, K) => {
  const w = (raw || '').trim().toUpperCase(), L = K.st().letter;
  if (!w) return { ok: false, why: 'No answer' };
  const bad = shape(w, K.st().lang || 'es') || (base(w[0]) !== L && 'does not start with ' + L);
  return bad ? { ok: false, why: bad } : { ok: true, why: 'Accepted' };
};
const item = (K, p) => K.S.items.find(i => i.player_id === p.id);
const calc = (K, p) => {
  const rev = (K.st().rev || {})[p.id] || {}, a = item(K, p)?.data.answers || {};
  let total = 0;
  const cells = cats(K).map(c => {
    const w = a[c.id]; if (!w) return { c, w: '' };
    const j = judge(w, K), ok = rev[c.id] !== undefined ? rev[c.id] : j.ok;
    if (ok) total += 10;
    return { c, w, ok, j };
  });
  return { cells, total };
};
const saveScores = async K => { await Promise.all(K.S.players.map(p => supabase.from('hub_players').update({ score: calc(K, p).total }).eq('id', p.id))); };
const review = K => {
  const rows = K.S.players.map(p => {
    const { cells, total } = calc(K, p);
    const tds = cells.map(x => !x.w ? '<td>—</td>' : `<td><button class="${x.ok ? 'y' : 'n'}" data-rv="${p.id}|${x.c.id}" title="${esc(x.j.why)}">${x.ok ? '✓' : '✗'} ${esc(x.w)}</button></td>`).join('');
    return `<tr><th>${K.pTag(p)}${item(K, p) ? '' : '<br><small>not sent</small>'}</th>${tds}<td><b>${total}</b></td></tr>`;
  }).join('');
  return `<div class="scroll"><table class="rv"><tr><th>Player</th>${cats(K).map(c => `<th>${esc(c.name)}</th>`).join('')}<th>Pts</th></tr>${rows}</table></div>`;
};
async function sendAnswers(K, stop) {
  if (K.sending || !K.me) return;
  const answers = {}; document.querySelectorAll('.ans').forEach(i => { answers[i.dataset.id] = i.value.trim().toUpperCase(); });
  if (!Object.keys(answers).length) return;
  K.sending = true;
  await supabase.from('hub_items').delete().eq('room_code', K.CODE).eq('player_id', K.me.id);
  const { error } = await supabase.from('hub_items').insert([{ room_code: K.CODE, player_id: K.me.id, kind: 'answers', data: { answers } }]);
  K.sending = false;
  if (error) return K.err(error);
  if (stop) await patchRoom(K.CODE, { status: 'stopped' });
  K.refresh();
}

const KK = await boot({
  game: 'stop', ui: 'en', cat0: 'es', items: true,
  init: { letter: rl, lang: 'es', cat_count: 8 }, blank: { rev: {} },
  key: K => [!!(K.me && item(K, K.me)), K.host ? K.S.items.length + JSON.stringify(K.st().rev || {}) : '', K.S.room?.status === 'podium' ? K.S.players.map(p => p.score).join() : ''].join('|'),
  light: K => { const c = $('#count'); if (c) c.textContent = `${K.S.items.length}/${K.S.players.length} submitted`; },
  tick: K => { if (!K.host && K.me && K.S.room?.status === 'playing' && K.st().ends_at && K.remaining() <= 0 && !item(K, K.me)) sendAnswers(K, false); },
  leave: (K, prev, next) => { if (!K.host && K.me && prev === 'playing' && next !== 'playing' && !item(K, K.me)) sendAnswers(K, false); },
  host: (K, s) => {
    const st = K.st();
    if (s === 'lobby') return K.lobbyTop() + `<div class="box"><h2>Round panel</h2><p class="muted">1. Language of the answers</p>
      <div class="tiles">${Object.entries(LANGS).map(([k, n]) => `<button class="tile ${K.cat === k ? 'on' : ''}" data-cat="${k}"><span class="big">${k === 'es' ? '🇨🇴' : '🇬🇧'}</span>${n}</button>`).join('')}</div>
      <div class="row"><label for="lt"><b>Letter</b></label><select id="lt">${AL.map(l => `<option ${l === (st.letter || rl) ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <label for="nc"><b>Categories</b></label><input id="nc" type="number" min="3" max="9" value="8"><label for="secs"><b>Seconds</b></label><input id="secs" type="number" min="30" max="1800" value="180"></div>
      <div class="row"><button class="main" id="startgame" data-act="start" disabled>Start round!</button>${K.clearBtn}</div></div>`;
    if (s === 'playing') return `<div class="box"><div class="row"><div class="letter">${esc(st.letter)}</div><div class="timer" id="timer"></div></div><p class="big" id="count"></p></div><button class="main" data-act="close">🛑 Close round &amp; review</button>`;
    if (s === 'stopped') return `<div class="box"><h2>✅ Review (letter ${esc(st.letter)})</h2><p class="muted">Click an answer to accept it (green) or reject it (red). Each accepted answer is worth 10 points.</p>${review(K)}</div><div class="row"><button class="main" data-act="podium">🏆 Save &amp; show podium</button></div>`;
    return `<div class="box"><h2>🏆 Podium</h2>${K.rank()}</div><div class="box"><h2>Review</h2>${review(K)}</div><div class="row"><button class="main" data-act="reset">New round</button>${K.clearBtn}</div>`;
  },
  player: (K, s) => {
    const st = K.st(), hello = `<p class="muted">Playing as ${K.pTag(K.me)} · <b>${K.me.score} pts</b></p>`;
    if (s === 'lobby') return `${hello}<div class="box"><h2>You're in 🎉</h2><p>Wait for the teacher to start the round.</p><div class="chips" id="plist"></div></div>`;
    if (s === 'playing') {
      if (item(K, K.me)) return `${hello}<div class="box"><h2>Sent ✓</h2><p>Wait for the teacher's review.</p><div class="timer" id="timer"></div></div>`;
      return `${hello}<div class="box"><div class="row"><div class="letter">${esc(st.letter)}</div><div class="timer" id="timer"></div></div>
        <p class="muted">Answers in ${LANGS[st.lang || 'es']}.</p>
        ${cats(K).map((c, i) => `<div class="ecard"><span class="num">${i + 1}.</span><b class="lab">${esc(c.name)}</b><input class="ans" data-id="${c.id}" type="text" maxlength="30" placeholder="${esc(st.letter)}…" autocomplete="off" autocorrect="off" spellcheck="false" aria-label="${esc(c.name)}"></div>`).join('')}
        <button class="main" data-act="send">🛑 STOP! Send answers</button></div>`;
    }
    if (s === 'stopped') return `${hello}<div class="box"><h2>🛑 Round closed</h2><p>Your answers were sent. Wait for the teacher's review.</p></div>`;
    return `${hello}<div class="box"><h2>🏆 Podium</h2>${K.rank()}</div><div class="box"><h2>Your answers</h2><ul class="res">${calc(K, K.me).cells.map(x => `<li class="${x.ok ? 'ok' : ''}"><b>${esc(x.c.name)}:</b> ${x.w ? `${x.ok ? '✓' : '✗'} ${esc(x.w)}${x.ok ? '' : ' (' + esc(x.j.why) + ')'}` : '—'}</li>`).join('')}</ul></div>`;
  },
  actions: K => ({
    async start() {
      const letter = $('#lt').value, n = clamp(+$('#nc').value || 8, 3, 9), secs = clamp(+$('#secs').value || 180, 30, 1800);
      await supabase.from('hub_items').delete().eq('room_code', K.CODE);
      await supabase.from('hub_players').update({ score: 0 }).eq('room_code', K.CODE);
      const { error } = await supabase.rpc('hub_start_phase', { p_code: K.CODE, p_status: 'playing', p_secs: secs, p_reset: { letter, lang: K.cat, cat_count: n, rev: {}, scored: false } });
      if (error) K.err(error); K.refresh();
    },
    async send() {
      const lang = K.st().lang || 'es', bad = [];
      document.querySelectorAll('.ans').forEach(i => { const r = shape(i.value.trim().toUpperCase(), lang); i.style.borderColor = r ? '#dc2626' : ''; if (r) bad.push(`• ${i.getAttribute('aria-label')}: ${r}`); });
      if (bad.length) { alert('⛔ Fix these boxes (or leave them empty):\n\n' + bad.join('\n')); return; }
      await sendAnswers(K, true);
    },
    async close() { await patchRoom(K.CODE, { status: 'stopped' }); K.refresh(); },
    async podium() { await saveScores(K); await patchRoom(K.CODE, { status: 'podium', scored: true }); K.refresh(); }
  }),
  click: async (e, K) => {
    const b = e.target.closest('[data-rv]'); if (!b || !K.host) return false;
    const [pid, cid] = b.dataset.rv.split('|'), p = K.S.players.find(x => x.id === pid);
    const cur = calc(K, p).cells.find(x => x.c.id === cid).ok, rev = { ...(K.st().rev || {}) };
    rev[pid] = { ...(rev[pid] || {}), [cid]: !cur };
    await patchRoom(K.CODE, { rev }); await K.refresh();
    if (K.S.room.status === 'podium') { await saveScores(K); await K.refresh(); }
    return true;
  }
});
// While typing: uppercase and only letters of the chosen language
document.addEventListener('input', e => {
  const el = e.target.closest?.('.ans'); if (!el) return;
  const L = LET[KK.st().lang || 'es'] || LET.es;
  let v = el.value.toUpperCase().replace(new RegExp(`[^${L} '’-]`, 'g'), '').replace(/^[ '’-]+/, '').replace(/ {2,}/g, ' ');
  if (v !== el.value) el.value = v;
  el.style.borderColor = '';
});
</script>
</body>
</html>
